# live-build configuration notes for DEADDROP-OS Debian 12 amd64.
# Run from a clean Debian 12 builder with live-build installed:
#   lb config --distribution bookworm --architectures amd64 --binary-images iso-hybrid \
#     --bootappend-live "boot=live components noeject ipv6.disable=1" \
#     --debian-installer false --archive-areas "main"
#   lb build
